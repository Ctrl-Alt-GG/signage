# One pipeline: static checks, tests, the two container images, and on main and tags the
# publish to GHCR. Steps are GitHub Actions wherever one exists; the only shell steps are
# the toolchain commands no action covers (`uv run ...`, `pnpm ...`).
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check .

  backend:
    name: Backend tests and API schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The suite also covers the project health checks: Django system checks, migrations
      # current, content lint, schema validity. The OpenAPI schema the frontend compiles
      # against is generated here and handed over as an artifact.
      - name: Tests and OpenAPI schema
        run: >-
          uv run --frozen pytest
          && uv run --frozen python manage.py spectacular --file frontend/openapi.yaml --validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: frontend/openapi.yaml
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend types, typecheck, tests and build
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi
          path: frontend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, generate types, typecheck, test and build
        run: >-
          pnpm install --frozen-lockfile
          && pnpm openapi && pnpm typecheck && pnpm test && pnpm build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Check display safe area and announcements
        working-directory: .
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
          DATABASE_URL=sqlite:////tmp/signage-screenshots.sqlite3 uv run python manage.py migrate --noinput
          DATABASE_URL=sqlite:////tmp/signage-screenshots.sqlite3 uv run python manage.py loadcontent
          DATABASE_URL=sqlite:////tmp/signage-screenshots.sqlite3 uv run python manage.py shell -c 'from signage.models import Event; event = Event.get_solo(); event.wifi_ssid = "CtrlAltGG"; event.wifi_password = "only-for-screenshots"; event.assembly_point_hu = "Az épület előtt"; event.assembly_point_en = "In front of the building"; event.save()'
          DATABASE_URL=sqlite:////tmp/signage-screenshots.sqlite3 uv run python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/signage-backend.log 2>&1 &
          backend_pid=$!
          (cd frontend && pnpm preview --host 127.0.0.1) > /tmp/signage-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/health/?format=json > /dev/null; then
              break
            fi
            sleep 1
          done
          uv run python scripts/screenshots.py --base-url http://127.0.0.1:4173

  images:
    name: Image ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [python-lint, backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            description: "Ctrl-Alt-GG Signage backend: Django admin and JSON API."
          - component: frontend
            description: "Ctrl-Alt-GG Signage display: the React screen served by nginx."
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/ctrl-alt-gg/signage-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
