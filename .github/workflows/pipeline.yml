# One pipeline: static checks, tests, the three container images, and on main and tags the
# publish to GHCR. Steps are GitHub Actions wherever one exists; the only shell steps are
# the toolchain commands no action covers (`uv run ...`, `pnpm ...`).
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .
      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check .

  backend:
    name: Backend tests and API schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The suite also covers the project health checks: Django system checks, migrations
      # current, content lint, schema validity. The OpenAPI schema the frontend compiles
      # against is generated here and handed over as an artifact.
      - name: Tests and OpenAPI schema
        run: >-
          uv run --frozen pytest
          && uv run --frozen python manage.py spectacular --file frontend/openapi.yaml --validate
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: frontend/openapi.yaml
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend types, typecheck, tests and build
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openapi
          path: frontend
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, generate types, typecheck, test and build
        run: >-
          pnpm install --frozen-lockfile
          && pnpm openapi && pnpm typecheck && pnpm test && pnpm build

  images:
    name: Image ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [python-lint, backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            description: "Ctrl-Alt-GG Signage backend: Django admin and JSON API."
          - component: frontend
            description: "Ctrl-Alt-GG Signage display: the React screen served by nginx."
          - component: minio
            description: "Ctrl-Alt-GG Signage object storage: MinIO built from source."
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/ctrl-alt-gg/signage-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
