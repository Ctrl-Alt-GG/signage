# One pipeline: static checks, tests, the container build, and on main and tags the
# publish to GHCR. Steps are GitHub Actions wherever one exists; the only shell steps
# are the two commands the toolchains have no action for (`uv run pytest`, `pnpm ...`).
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ctrl-alt-gg/signage-web

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ruff check
        uses: astral-sh/ruff-action@v4
        with:
          args: check .
      - name: Ruff format
        uses: astral-sh/ruff-action@v4
        with:
          args: format --check .

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, typecheck, test and build
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # The test suite also covers the project health checks: Django system checks,
      # migrations are current, content YAML lints and docs/content.md and
      # docs/openapi.yaml are in sync. `uv run` syncs the locked environment itself.
      - name: Tests
        run: uv run --frozen pytest

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [python-lint, frontend, backend]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.description=Ctrl-Alt-GG Signage: Django backend and React display for the LAN party screens.
          annotations: |
            org.opencontainers.image.description=Ctrl-Alt-GG Signage: Django backend and React display for the LAN party screens.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
