name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.description=Ctrl-Alt-GG Signage: Django backend and React display for the LAN party screens.
            manifest:org.opencontainers.image.description=Ctrl-Alt-GG Signage: Django backend and React display for the LAN party screens.
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}/signage-web:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.namespace }}/signage-web:latest
      - name: Attest OCI image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.namespace }}/signage-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
