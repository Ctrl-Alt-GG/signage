services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  setup:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/media:/app/data/media
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py loadcontent"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/media:/app/data/media
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      setup:
        condition: service_completed_successfully
