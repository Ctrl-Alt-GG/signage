# The production stack from the published images: Postgres, MinIO (static files and
# uploads), the Django backend (a one-shot setup job and the web process) and the nginx
# frontend that kiosks and organizers talk to. Copy .env.example to .env first.
services:
  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-minio:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/minio:/data
    ports:
      # Browsers fetch the admin's static files and the background from here, so this is
      # what STORAGE_PUBLIC_URL must point at (directly or through the host's reverse proxy).
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  setup:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-backend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    environment:
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py ensurestorage
        && python manage.py migrate --noinput
        && python manage.py collectstatic --noinput
        && python manage.py loadcontent
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-backend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    environment:
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      setup:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/signage-frontend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://web:8000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
