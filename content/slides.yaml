# The signage copy. This file is the source of truth for the text on the
# screens; scripts/render_content.py lints it and renders a Markdown preview.
#
# `manage.py loadcontent` upserts every slide by `id`. Organizers then edit
# in the Django admin; re-running loadcontent without `--overwrite` leaves
# admin edits alone.
#
# Every slide is bilingual on one pass: Hungarian is the large, primary text
# and English sits beneath it, smaller. Keep items short (about 40
# characters in Hungarian) and at most four or five per slide so both
# languages fit the box; the screenshot check fails on clipped text.
#
# Field reference (the model is src/signage/models.py)
#   id              stable key, lowercase, underscores.
#   layout          hero | list | split | qr | credentials | now_next |
#                   schedule | servers | tournament | streams | countdown.
#   source          static (text below) or live:<integration>. Live slides are
#                   rendered from upstream data at bundle time; the text here
#                   is the chrome around the data (title, empty state, footer).
#   phases          which event phases include this slide. Keys from
#                   content/event.yaml. "all" means every phase.
#   duration_seconds how long the slide is shown.
#   bilingual_mode  stacked (default): both languages on one pass.
#                   alternate: a Hungarian pass, then an English pass.
#   priority        higher sorts earlier inside a rotation cycle. Default 50.
#   kicker/title/body/footer/empty   bilingual strings. body and footer may
#                   contain a few inline Markdown marks (bold, code).
#   items           bilingual bullet list. Optional `icon` is a Lucide icon
#                   name, never an emoji in the text itself.
#   columns         for the split layout: exactly two {title, items}.
#   link            {url, label, qr}. qr: true renders a QR code for url.
#   placeholders    strings in {braces} are replaced from the Event model at
#                   render time: {wifi_ssid} {wifi_password} {wifi_note}
#                   {venue_name} {venue_address} {starts_at_time}
#                   {starts_at_date} {assembly_point} {email}.
#
# Prose rules: straight quotes only, no em or en dashes, no ellipsis
# character, Hungarian in informal "te", second person, present tense. The
# render script fails on banned glyphs.

version: 2

defaults:
  duration_seconds: 15
  bilingual_mode: stacked
  priority: 50

slides:
  # ---------------------------------------------------------------- setup
  - id: doors_countdown
    layout: countdown
    source: live:clock
    phases: [setup]
    duration_seconds: 20
    priority: 90
    kicker:
      hu: "Hamarosan"
      en: "Soon"
    title:
      hu: "Kezdés {starts_at_time}-kor"
      en: "Starting at {starts_at_time}"
    body:
      hu: "Pakolj ki, dugd be a kék kábelt, frissítsd a játékaidat."
      en: "Unpack, plug in the blue cable, update your games."
    notes: >
      Renders a live countdown to event.starts_at. After the target passes
      the player shows "Elkezdődött!" / "We are live!" and the slide leaves
      the rotation.

  - id: entrance
    layout: hero
    source: static
    phases: [setup, arrival]
    duration_seconds: 12
    priority: 80
    kicker:
      hu: "Bejárat"
      en: "Entrance"
    title:
      hu: "Nem a főbejárat!"
      en: "Not the main entrance"
    body:
      hu: "A Nagymihály utcai kétoldalú lépcsőn gyere. {venue_name}, {venue_address}"
      en: "Use the two-sided staircase on Nagymihály utca. {venue_name}, {venue_address}"

  # -------------------------------------------------------------- arrival
  - id: welcome
    layout: hero
    source: static
    phases: [arrival, play]
    duration_seconds: 12
    priority: 95
    kicker:
      hu: "GL&HF, IRL."
      en: "GL&HF, IRL."
    title:
      hu: "Üdv a bulin, nerdek!"
      en: "Welcome to the party, nerds!"
    body:
      hu: "Dugd be a kék kábelt, és nyisd meg a www.ctrl-alt-gg.hu oldalt. Ha betölt, fent vagy."
      en: "Plug in the blue cable and open www.ctrl-alt-gg.hu. If it loads, you are online."

  - id: start_here
    layout: qr
    source: static
    phases: all
    duration_seconds: 18
    priority: 92
    kicker:
      hu: "Innen indulj"
      en: "Start here"
    title:
      hu: "www.ctrl-alt-gg.hu"
      en: "www.ctrl-alt-gg.hu"
    items:
      - hu: "Játékok, menetrend, szerverek"
        en: "Games, schedule, servers"
      - hu: "Segítség és házirend"
        en: "Help and house rules"
      - hu: "Linkek a többi oldalra"
        en: "Links to every other site"
    link:
      url: "https://www.ctrl-alt-gg.hu"
      label:
        hu: "Olvasd be"
        en: "Scan me"
      qr: true

  - id: wifi
    layout: credentials
    source: static
    phases: [arrival, play, tournament, late]
    duration_seconds: 15
    priority: 85
    title:
      hu: "Wi-Fi"
      en: "Wi-Fi"
    body:
      hu: "{wifi_note}"
      en: "{wifi_note}"
    footer:
      hu: "Hálózat: {wifi_ssid}  Jelszó: {wifi_password}"
      en: "Network: {wifi_ssid}  Password: {wifi_password}"
    link:
      url: "wifi"
      qr: true
    notes: >
      The credentials layout shows the SSID and password in large monospace
      and a WIFI: QR code so phones join with one scan. {wifi_note} resolves
      to wifi.note in event.yaml.

  - id: lobby_site
    layout: qr
    source: static
    phases: [setup, arrival, play]
    duration_seconds: 15
    priority: 70
    kicker:
      hu: "Regisztráció"
      en: "Registration"
    title:
      hu: "lobby.ctrl-alt-gg.hu"
      en: "lobby.ctrl-alt-gg.hu"
    items:
      - hu: "Jegy és regisztráció"
        en: "Ticket and registration"
      - hu: "Csapat létrehozása"
        en: "Create your team"
      - hu: "Az állapotod egy helyen"
        en: "Your status in one place"
    link:
      url: "https://lobby.ctrl-alt-gg.hu"
      label:
        hu: "lobby.ctrl-alt-gg.hu"
        en: "lobby.ctrl-alt-gg.hu"
      qr: true

  - id: house_rules
    layout: list
    source: static
    phases: [arrival, play]
    duration_seconds: 18
    priority: 70
    title:
      hu: "Házirend"
      en: "House rules"
    items:
      - hu: "Csak fejhallgató, hangfal tilos."
        en: "Headsets only, no speakers."
      - hu: "Hálózathoz, kábelekhez ne nyúlj."
        en: "Do not touch the network or the cables."
      - hu: "Nincs csalás, nincs zavarás."
        en: "No cheating, no disruption."
      - hu: "Más gépéhez ne nyúlj. Legyél fair."
        en: "Do not touch other people's rigs. Be fair."

  - id: power_network
