      hu: "Most senki nem ad. Indíts egyet te!"
      en: "Nobody is live. Start a stream!"
    footer:
      hu: "streams.ctrl-alt-gg.hu, fülhallgatóval"
      en: "streams.ctrl-alt-gg.hu, with headphones"
    notes: >
      Cards for channels with status "live": thumbnail, name, audio-only
      badge. When the upstream is stale the footer gets a small tag; the
      slide never shows an error message to the room.

  - id: streams_site
    layout: qr
    source: static
    phases: [play, tournament, late]
    duration_seconds: 15
    priority: 42
    kicker:
      hu: "Streams"
      en: "Streams"
    title:
      hu: "streams.ctrl-alt-gg.hu"
      en: "streams.ctrl-alt-gg.hu"
    items:
      - hu: "Élő adások a teremből"
        en: "Live broadcasts from the room"
      - hu: "Nézd fülhallgatóval"
        en: "Watch with headphones"
      - hu: "Adj te is: OBS, kulcs live/neved"
        en: "Go live too: OBS, key live/yourname"
    link:
      url: "https://streams.ctrl-alt-gg.hu"
      label:
        hu: "streams.ctrl-alt-gg.hu"
        en: "streams.ctrl-alt-gg.hu"
      qr: true

  # ----------------------------------------------------------- tournament
  - id: tournament_live
    layout: tournament
    source: live:bracket
    phases: [tournament]
    duration_seconds: 20
    priority: 95
    title:
      hu: "CS2-bajnokság"
      en: "CS2 tournament"
    sections:
      live:
        hu: "Most játszanak"
        en: "Playing now"
      upcoming:
        hu: "Következő meccsek"
        en: "Coming up next"
      results:
        hu: "Eredmények"
        en: "Results"
    empty:
      hu: "Most nincs futó meccs."
      en: "No match is running right now."
    footer:
