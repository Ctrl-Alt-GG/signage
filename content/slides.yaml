      - hu: "Szöveg: Discord #general, #support"
        en: "Text: Discord #general, #support"
      - hu: "Evés és köhögés közben némíts"
        en: "Mute while eating or coughing"

  - id: downloads
    layout: list
    source: static
    phases: [arrival, play]
    duration_seconds: 18
    priority: 60
    title:
      hu: "Letöltések"
      en: "Downloads"
    items:
      - hu: "Steam, Epic, Battle.net: helyi cache-ből, gyorsan"
        en: "Steam, Epic, Battle.net: from the local cache, fast"
      - hu: "Filehost: filehost.ctrl-alt-gg.hu (lanshare)"
        en: "Filehost: filehost.ctrl-alt-gg.hu (lanshare)"
      - hu: "Felhőszinkront állítsd le"
        en: "Pause cloud sync"
      - hu: "Torrent és warez tilos"
        en: "No torrents, no piracy"

  - id: organizers
    layout: hero
    source: static
    phases: [arrival, play]
    duration_seconds: 12
    priority: 40
    kicker:
      hu: "Szervezők"
      en: "Organizers"
    title:
      hu: "FiNT, Marcsello, TormaKris és Bence"
      en: "FiNT, Marcsello, TormaKris and Bence"
    body:
      hu: "Kérdésed van? Keresd azt, aki meghívott, vagy írj: {email}"
      en: "Questions? Ask whoever invited you, or write to {email}"

  # ----------------------------------------------------------------- play
  - id: now_next
    layout: now_next
    source: live:schedule
    phases: [play, tournament, late, morning]
    duration_seconds: 15
    priority: 90
    title:
      hu: "Mi megy most?"
      en: "What is on now?"
    columns_labels:
      now:
        hu: "Most"
        en: "Now"
      next:
        hu: "Következik"
        en: "Next"
      later:
        hu: "Később"
        en: "Later"
    empty:
      hu: "Nincs kiírt program. Játssz, amit szeretnél."
      en: "Nothing scheduled right now. Play whatever you like."
    footer:
      hu: "A menetrend csak iránymutató."
      en: "The schedule is only a guideline."

  - id: schedule_upcoming
    layout: schedule
    source: live:schedule
    phases: [play, tournament, late, morning]
    duration_seconds: 18
    priority: 65
    title:
      hu: "Menetrend"
      en: "Schedule"
    footer:
      hu: "A menetrend csak iránymutató."
      en: "The schedule is only a guideline."
    notes: >
      Shows the current slot and the next five. Each row is the time, the game
      name large and the slot title small; notes are not shown. Break rows use
      the gold accent, highlight rows the red accent.

  - id: cs2_tournament
    layout: list
    source: static
    phases: [arrival, play]
    duration_seconds: 18
    priority: 85
    kicker:
      hu: "Bajnokság"
      en: "Tournament"
    title:
      hu: "CS2-bajnokság 20:00-tól"
      en: "CS2 tournament from 20:00"
    items:
      - hu: "Nevezés: bracket.ctrl-alt-gg.hu"
        en: "Sign up: bracket.ctrl-alt-gg.hu"
      - hu: "Légy a gépednél 10 perccel előbb"
        en: "Be at your PC 10 minutes early"
      - hu: "Az admin szava döntő"
        en: "The admin's word is final"
      - hu: "Díjátadó 22:00-kor a gyülekezőnél"
        en: "Awards at 22:00 at the gathering area"
    notes: >
      The two times mirror the highlight rows in content/schedule.yaml. When
      the schedule changes, change both.

