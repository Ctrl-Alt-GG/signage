    title:
      hu: "bracket.ctrl-alt-gg.hu"
      en: "bracket.ctrl-alt-gg.hu"
    items:
      - hu: "Nevezés a csapatoddal"
        en: "Sign up with your team"
      - hu: "Meccsek és időpontok"
        en: "Matches and times"
      - hu: "Eredmények és tabella"
        en: "Results and standings"
    link:
      url: "https://bracket.ctrl-alt-gg.hu"
      label:
        hu: "bracket.ctrl-alt-gg.hu"
        en: "bracket.ctrl-alt-gg.hu"
      qr: true

  - id: servers
    layout: servers
    source: live:projectile
    phases: [play, tournament, late, morning]
    duration_seconds: 15
    priority: 80
    title:
      hu: "Szerverek"
      en: "Game servers"
    empty:
      hu: "Most nincs elérhető szerveradat."
      en: "Server data is unavailable right now."
    footer:
      hu: "Címek: servers.ctrl-alt-gg.hu"
      en: "Addresses: servers.ctrl-alt-gg.hu"
    notes: >
      Up to eight cards: game colour header, server name, players as
      "online / max" when Projectile reports a count, otherwise "max: N".

  - id: console_corner
    layout: hero
    source: static
    phases: [play, late]
    duration_seconds: 12
    priority: 45
    kicker:
      hu: "Konzol Kuckó"
      en: "Console Corner"
    title:
      hu: "Xbox Series X a kanapén"
      en: "Xbox Series X on the couch"
    body:
      hu: "Game Pass Ultimate, két kontroller, nagy képernyő. Bárkinek, bármikor."
      en: "Game Pass Ultimate, two controllers, a big screen. For anyone, any time."

  - id: food
    layout: list
    source: static
    phases: [play, late]
    duration_seconds: 18
    priority: 55
    title:
      hu: "Kaja és pia"
      en: "Food and drink"
    items:
      - hu: "Nincs büfé, mindenki magának intézi"
