    source: static
    phases: [arrival, play]
    duration_seconds: 18
    priority: 70
    title:
      hu: "Áram és hálózat"
      en: "Power and network"
    columns:
      - title:
          hu: "Áram"
          en: "Power"
        items:
          - hu: "Fejenként két aljzat. Hozz elosztót."
            en: "Two outlets per person. Bring a power strip."
          - hu: "UPS szigorúan tilos."
            en: "UPS units are forbidden."
          - hu: "Vízforraló, hősugárzó, hűtő: tilos."
            en: "No kettles, heaters or fridges."
      - title:
          hu: "Hálózat"
          en: "Network"
        items:
          - hu: "Automatikus IP (DHCP), statikus nem megy."
            en: "Automatic IP (DHCP), static does not work."
          - hu: "DNS-t ne állíts, a 8.8.8.8 kikerüli a cache-t."
            en: "Keep the DNS automatic, 8.8.8.8 skips the cache."
          - hu: "Saját switch, router, AP tilos."
            en: "No personal switches, routers or APs."

  - id: help
    layout: qr
    source: static
    phases: [setup, arrival, play, tournament, late, morning]
