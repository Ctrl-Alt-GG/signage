      - hu: "Kisebb sérülés: szervezői asztal, van elsősegélydoboz."
        en: "Minor injury: organizer desk, there is a first aid kit."
      - hu: "Tűzjelzés: azonnal ki. A géped marad, te nem."
        en: "Fire alarm: leave immediately. The PC stays, you do not."
      - hu: "Gyülekező: {assembly_point}"
