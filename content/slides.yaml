        en: "Discord: #support"
      - hu: "Keress valakit staff pólóban"
        en: "Find anyone in a staff shirt"
      - hu: "Mondd el: hol ülsz, mi a gond"
        en: "Say where you sit and what is wrong"
    link:
      url: "https://care.ctrl-alt-gg.hu"
      label:
        hu: "care.ctrl-alt-gg.hu"
        en: "care.ctrl-alt-gg.hu"
      qr: true

  - id: voice
    layout: list
