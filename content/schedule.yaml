# The published schedule, copied from the homepage's schedule page
# (content/schedule/_index.md and _index.en.md in Ctrl-Alt-GG/homepage).
# Loaded into ScheduleEntry rows by `manage.py loadcontent`.
#
# Fields
#   key         stable lowercase slug the import matches on; rename titles freely,
#               never reuse a key for a different slot.
#   time        local wall-clock time, HH:MM
#   day_offset  0 for the first day, 1 for after midnight. The app combines
#               event.starts_at's date, day_offset and time into one timestamp.
#   type        play | break | highlight. Drives the accent colour, see frontend/src/layouts/.
#   game        slug from content/games.yaml, or empty.
#   label       game or activity name shown as a pill. Same in both languages.
#   title, note bilingual.
#
# The schedule is a guideline. Every slide that shows it must carry the line
# "A menetrend csak iránymutató" / "The schedule is only a guideline".

entries:
