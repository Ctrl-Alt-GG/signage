    en: "Always free on the building side. Free on weekends across the street, metered on weekdays."
  assembly_point:
    # Not published anywhere. Fill in before the event.
    hu: "CHANGE-ME"
    en: "CHANGE-ME"
  transit:
    - mode: bus
      stop: "Búza utca"
      distance_m: 320
      lines: ["118"]
      night_lines: ["918"]
    - mode: bus
      stop: "Óbuda, Bogdáni út"
      distance_m: 900
      lines: ["9"]
      night_lines: ["909", "918"]
    - mode: tram
      stop: "Bécsi út / Vörösvári út"
      distance_m: 530
      lines: ["17", "19", "41"]
      night_lines: []
    - mode: night_bus
      stop: "Bécsi út / Vörösvári út"
      distance_m: 530
      lines: []
      night_lines: ["901", "917", "960"]
    - mode: hev
