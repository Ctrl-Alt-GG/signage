# Phases drive which slides are in rotation. The organizer sets the current
# phase in the admin; `auto` picks it from the clock using the boundaries
# below (local time, relative to starts_at's date).
phases:
  - key: setup
    hu: "Berendezkedés"
    en: "Setup"
    starts: "12:00"
  - key: arrival
    hu: "Érkezés"
    en: "Arrival"
    starts: "14:30"
  - key: play
    hu: "Játék"
    en: "Play"
    starts: "15:30"
  - key: tournament
    hu: "Bajnokság"
    en: "Tournament"
    starts: "19:45"
  - key: late
    hu: "Éjszaka"
    en: "Late night"
    starts: "22:30"
  - key: morning
    hu: "Reggel"
    en: "Morning"
    starts: "05:30"
    day_offset: 1
  - key: teardown
    hu: "Pakolás"
    en: "Teardown"
    starts: "07:00"
    day_offset: 1
