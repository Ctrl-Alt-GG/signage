# Event facts for the signage. Loaded by `manage.py loadcontent` into the Event
# model, then editable in the Django admin. The admin copy wins after the first
# load; re-running loadcontent only fills fields that are still empty unless
# `--overwrite` is passed.
#
# Values below were read from the sibling repositories on 2026-10-06
# (homepage, care, link-collection, network-services). Anything marked
# CHANGE-ME was not published anywhere and must be set by an organizer.

event:
  name: "Ctrl-Alt-GG"
  tagline: "GL&HF, IRL."
  # The homepage countdown pointed at this date when the content was read.
  # Confirm before the next event; the schedule below starts at 15:30.
  starts_at: "2026-10-03T15:30:00+02:00"
  # The published schedule ends at 06:00 the next morning. Teardown end is a
  # guess; set the real closing time in the admin.
  ends_at: "2026-10-04T08:00:00+02:00"
  timezone: "Europe/Budapest"
  languages: ["hu", "en"]
  default_language: "hu"

venue:
  name: "DISTR3CT Event Cube"
  address: "1037 Budapest, Nagymihály utca 2."
  district: "Budapest III. (Óbuda)"
  lat: 47.5513926
  lng: 19.0354529
  entrance_note:
    hu: "Az esemény bejárata nem az épület főbejárata, hanem a Nagymihály utcai kétoldalú lépcső."
