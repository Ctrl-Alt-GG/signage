# Game dictionary. Slugs match data/games.yaml in Ctrl-Alt-GG/homepage so the
# same slug works in the schedule and on the homepage.
#
#   projectile_keys  the `game` values the Projectile server list uses for this
#                    game (from src/data/icons.js in projectile-frontend). The
#                    servers slide maps Projectile entries to a game through
#                    these keys; unknown keys fall back to a neutral card.
#   color            header colour pair from projectile-frontend's colors.js so
#                    server cards look the same on the wall and on the signage.
#   hosted           true when the homepage marks the game with the server icon
#                    (an organizer-hosted server is guaranteed).

games:
  - slug: cs2
    name: "Counter-Strike 2"
    short: "CS2"
    hosted: true
    tournament: true
    projectile_keys: ["cs2", "csgo"]
    color: { bg: "#c9a227", text: "#000000" }
  - slug: css
    name: "Counter-Strike: Source"
