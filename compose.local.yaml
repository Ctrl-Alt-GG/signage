# Build the two images from this checkout and run them against SQLite, for trying the
# stack without a registry or Postgres: `docker compose -f compose.local.yaml up --build`.
# The display is then at http://localhost:8080/ and the admin at http://localhost:8080/admin/.
x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: local-only-secret
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  # No TLS on this machine. The settings refuse this for any other host name.
  DJANGO_INSECURE_LOCAL: "true"
  DATABASE_URL: sqlite:////app/data/db/db.sqlite3

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment: *backend-environment
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  setup:
    <<: *backend
    restart: "no"
    volumes:
      - local-db:/app/data/db
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput
        && python manage.py loadcontent

  web:
    <<: *backend
    volumes:
      - local-db:/app/data/db
      - local-media:/app/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      setup:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      BACKEND_URL: http://web:8000
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      web:
        condition: service_healthy

# Named volumes are created owned by the container user of the image that declares the
# path (the backend, 10001); bind mounts to missing host directories would be root-owned
# and unwritable.
volumes:
  local-db:
  local-media:
